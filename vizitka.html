<head>

<style>
  :root {
    --bg: #f3f3f0;
    --card: #ffffff;
    --ink: #17191c;
    --muted: #6b7076;
    --line: #e3e4e0;
    --wa: #1fa855;
    --wa-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101113;
      --card: #17191c;
      --ink: #f1f2f0;
      --muted: #9a9fa6;
      --line: #2a2d31;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 28px 28px;
  }

  h1 {
    font-size: clamp(26px, 8vw, 32px);
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .sub {
    margin-top: 12px;
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
  }

  .phone {
    display: block;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: clamp(24px, 7.5vw, 30px);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }

  .actions {
    display: grid;
    gap: 10px;
    margin-top: 20px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 52px;
    padding: 0 20px;
    border-radius: 14px;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .btn-wa { background: var(--wa); color: var(--wa-ink); }
  .btn-wa:hover { opacity: .92; }

  .btn-call {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-call:hover { border-color: var(--muted); }

  .btn svg { width: 22px; height: 22px; flex: none; fill: currentColor; }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>

  </main>
</body>
</html>
